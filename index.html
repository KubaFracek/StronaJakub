<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakub | Premium Web Developer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400&display=swap');

        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --accent: #ff3366; /* Neonowy róż/czerwień dla kontrastu */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            /* Ukrywamy standardowy kursor na desktopie, by użyć własnego w JS */
            cursor: none; 
        }

        a {
            text-decoration: none;
            color: inherit;
            cursor: none;
        }

        /* --- PRELOADER (Efekt Kurtyny) --- */
        .preloader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            display: flex;
            pointer-events: none;
        }

        .curtain {
            width: 100vw;
            height: 50vh;
            background-color: #111;
            position: absolute;
            left: 0;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .curtain.top { top: 0; align-items: flex-end; }
        .curtain.bottom { bottom: 0; align-items: flex-start; }

        .loader-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 8rem;
            color: var(--text-color);
            letter-spacing: 10px;
            line-height: 0; /* Ważne do idealnego połączenia połówek */
            position: absolute;
        }

        .curtain.top .loader-text { transform: translateY(50%); }
        .curtain.bottom .loader-text { transform: translateY(-50%); }

        /* Klasy dodawane przez JS do rozsunięcia kurtyny */
        .preloader.loaded .curtain.top { transform: translateY(-100%); }
        .preloader.loaded .curtain.bottom { transform: translateY(100%); }

        /* --- NAWIGACJA --- */
        nav {
            padding: 40px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .role {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- LISTA PROJEKTÓW (Główny Wow Effect) --- */
        .portfolio-list {
            padding: 10vh 5%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .project-item {
            display: flex;
            align-items: center;
            padding: 3vh 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUp 0.8s ease forwards;
        }

        /* Animacja wjazdu elementów z opóźnieniem */
        .project-item:nth-child(1) { animation-delay: 1.6s; }
        .project-item:nth-child(2) { animation-delay: 1.7s; }
        .project-item:nth-child(3) { animation-delay: 1.8s; }
        .project-item:nth-child(4) { animation-delay: 1.9s; }
        .project-item:nth-child(5) { animation-delay: 2.0s; }
        .project-item:nth-child(6) { animation-delay: 2.1s; }
        .project-item:nth-child(7) { animation-delay: 2.2s; }

        .project-num {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            color: #555;
            margin-right: 40px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        .project-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 7vw; /* Skaluje się do wielkości ekranu */
            text-transform: uppercase;
            line-height: 1;
            /* Efekt obrysu (Stroke text) */
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.5);
            transition: all 0.4s ease;
            position: relative;
        }

        .project-type {
            position: absolute;
            right: 0;
            font-size: 1.2rem;
            color: #888;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.4s ease;
        }

        /* Interakcje najechania myszką (Hover) */
        .project-item:hover .project-num {
            color: var(--accent);
        }

        .project-item:hover .project-name {
            color: #ffffff; /* Wypełnienie kolorem */
            -webkit-text-stroke: 1px transparent;
            transform: translateX(30px); /* Delikatne przesunięcie w prawo */
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .project-item:hover .project-type {
            opacity: 1;
            transform: translateX(0);
        }

        /* --- OBRAZ PODĄŻAJĄCY ZA KURSOREM --- */
        .cursor-image-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 450px;
            height: 300px;
            pointer-events: none; /* Żeby nie blokowało klikania w linki */
            z-index: 5;
            opacity: 0;
            transform: translate(-50%, -50%);
            /* Płynne przenikanie przezroczystości */
            transition: opacity 0.4s ease; 
        }

        .cursor-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            /* Zmiana zdjęcia z animacją skali */
            transition: background-image 0.4s ease, transform 0.4s ease;
            transform: scale(0.8);
        }

        /* Klasa dodawana przez JS gdy obraz ma się pokazać */
        .cursor-image-wrapper.active {
            opacity: 0.6; /* Półprzezroczysty, by tekst był czytelny */
        }

        .cursor-image-wrapper.active .cursor-image {
            transform: scale(1);
        }

        /* --- MAŁY KURSOR (Kropka) --- */
        .custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 10px; height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        .custom-cursor.hover {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 51, 102, 0.2);
            backdrop-filter: blur(2px);
            border: 1px solid var(--accent);
        }

        /* Obrazki widoczne tylko na telefonie */
        .mobile-img {
            display: none;
        }

        /* --- ANIMACJE KLUCZOWE --- */
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* --- RESPONSIVE (Telefony i Tablety) --- */
        @media (max-width: 900px) {
            body { cursor: auto; }
            a { cursor: pointer; }
            .custom-cursor, .cursor-image-wrapper { display: none !important; }
            
            .project-name { font-size: 3.5rem; -webkit-text-stroke: 0; color: #fff; }
            .project-item:hover .project-name { transform: none; }
            .project-type { position: relative; opacity: 1; transform: none; margin-top: 10px; font-size: 0.9rem; }
            .project-item { flex-direction: column; align-items: flex-start; }
            
            /* Miniaturki zamiast śledzącego obrazka */
            .mobile-img {
                display: block;
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 10px;
                margin-top: 20px;
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>

    <div class="custom-cursor"></div>
    <div class="cursor-image-wrapper">
        <div class="cursor-image"></div>
    </div>

    <div class="preloader">
        <div class="curtain top">
            <span class="loader-text">JAKUB</span>
        </div>
        <div class="curtain bottom">
            <span class="loader-text">JAKUB</span>
        </div>
    </div>

    <nav>
        <div class="logo">Jakub.</div>
        <div class="role">Creative Developer</div>
    </nav>

    <main class="portfolio-list">
        
        <a href="optyk.html" class="project-item" data-image="https://images.unsplash.com/photo-1574258495973-f010dfbb5371?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">01</span>
            <span class="project-name">STUDIOOPTIC</span>
            <span class="project-type">Glassmorphism</span>
            <img src="https://images.unsplash.com/photo-1574258495973-f010dfbb5371?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Optyk">
        </a>

        <a href="kawa.html" class="project-item" data-image="https://images.unsplash.com/photo-1559525839-b184a4d698c7?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">02</span>
            <span class="project-name">Czarna Ziarnista</span>
            <span class="project-type">Dark E-commerce</span>
            <img src="https://images.unsplash.com/photo-1559525839-b184a4d698c7?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Kawa">
        </a>

        <a href="architekt.html" class="project-item" data-image="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">03</span>
            <span class="project-name">Zielona Bryła</span>
            <span class="project-type">Asymmetric Arch</span>
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Architekt">
        </a>

        <a href="restauracja.html" class="project-item" data-image="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">04</span>
            <span class="project-name">Nomen Dining</span>
            <span class="project-type">Editorial Layout</span>
            <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Restauracja">
        </a>

        <a href="galeria.html" class="project-item" data-image="https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">05</span>
            <span class="project-name">PUNKT Galeria</span>
            <span class="project-type">Horizontal Scroll</span>
            <img src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Galeria">
        </a>

        <a href="barber.html" class="project-item" data-image="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">06</span>
            <span class="project-name">Siekiera & Brzytwa</span>
            <span class="project-type">Vintage Poster</span>
            <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Barber">
        </a>

        <a href="detailing.html" class="project-item" data-image="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&w=1000&q=80">
            <span class="project-num">07</span>
            <span class="project-name">APEX Detailing</span>
            <span class="project-type">Interactive Bg</span>
            <img src="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&w=600&q=80" class="mobile-img" alt="Auto">
        </a>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. Logika Preloadera (rozsuwanie kurtyny)
            setTimeout(() => {
                document.querySelector('.preloader').classList.add('loaded');
            }, 1000); // 1 sekunda trzymania ekranu z imieniem

            // Zmienne do śledzenia myszki
            const cursorDot = document.querySelector('.custom-cursor');
            const imgWrapper = document.querySelector('.cursor-image-wrapper');
            const cursorImg = document.querySelector('.cursor-image');
            const projects = document.querySelectorAll('.project-item');
            
            // Pozycje myszki i zdjęcia (do płynnego opóźnienia - Lerp)
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;
            let imgX = window.innerWidth / 2;
            let imgY = window.innerHeight / 2;

            // Nasłuchiwanie ruchu myszki
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                // Mała czerwona kropka podąża natychmiast
                cursorDot.style.left = mouseX + 'px';
                cursorDot.style.top = mouseY + 'px';
            });

            // Funkcja do płynnego (opóźnionego) ruchu wielkiego obrazka
            function animate() {
                // Matematyka (Lerp) dająca efekt "pływania" i ciężaru zdjęcia
                imgX += (mouseX - imgX) * 0.1;
                imgY += (mouseY - imgY) * 0.1;
                
                imgWrapper.style.left = imgX + 'px';
                imgWrapper.style.top = imgY + 'px';
                
                requestAnimationFrame(animate);
            }
            animate();

            // Logika Hover dla każdego projektu w liście
            projects.forEach(project => {
                project.addEventListener('mouseenter', () => {
                    // Pobierz url obrazka z atrybutu data-image
                    const imageUrl = project.getAttribute('data-image');
                    cursorImg.style.backgroundImage = `url(${imageUrl})`;
                    
                    // Pokaż obrazek
                    imgWrapper.classList.add('active');
                    // Powiększ mały kursor
                    cursorDot.classList.add('hover');
                });

                project.addEventListener('mouseleave', () => {
                    // Ukryj obrazek i zresetuj kursor
                    imgWrapper.classList.remove('active');
                    cursorDot.classList.remove('hover');
                });
            });
        });
    </script>
</body>
</html>
